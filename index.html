<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remito - Albardón Cerveza Artesanal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background-color: #f4f4f4;
      padding: 20px;
      color: #333;
    }

    .remito-container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    /* Encabezado */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #000;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      height: 60px;
      width: auto;
      object-fit: contain;
    }

    .marca-nombre {
      font-size: 28px;
      font-weight: bold;
      color: #000000; /* Texto en color negro */
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .remito-tipo {
      text-align: right;
    }

    .remito-tipo .letra-r {
      display: inline-block;
      font-size: 24px;
      font-weight: bold;
      border: 2px solid #000;
      padding: 5px 12px;
      margin-bottom: 5px;
    }

    .remito-tipo p {
      font-size: 14px;
      font-weight: bold;
    }

    /* Datos del cliente y fecha */
    .info-section {
      display: flex;
      justify-content: space-between;
      margin-bottom: 25px;
      gap: 20px;
    }

    .campo-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 10px;
    }

    .campo-group label {
      font-size: 13px;
      font-weight: bold;
      color: #555;
    }

    .campo-group input {
      padding: 8px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }

    .col-left {
      flex: 2;
    }

    .col-right {
      flex: 1;
    }

    /* Tabla de productos/barriles */
    .tabla-items {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }

    .tabla-items th, 
    .tabla-items td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
      font-size: 14px;
    }

    .tabla-items th {
      background-color: #f8f8f8;
      font-weight: bold;
      color: #000;
    }

    .text-center {
      text-align: center;
    }

    /* Firma y observaciones */
    .footer-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 40px;
      padding-top: 20px;
    }

    .observaciones {
      width: 55%;
    }

    .observaciones textarea {
      width: 100%;
      height: 80px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: none;
      font-size: 13px;
    }

    .firma-box {
      width: 35%;
      border-top: 1px dashed #000;
      text-align: center;
      padding-top: 8px;
      font-size: 13px;
      font-weight: bold;
    }

    /* Ocultar elementos innecesarios al imprimir */
    @media print {
      body {
        background-color: #fff;
        padding: 0;
      }
      .remito-container {
        border: none;
        box-shadow: none;
        width: 100%;
        max-width: 100%;
        padding: 0;
      }
      input, textarea {
        border: none !important;
        background: transparent !important;
      }
    }
  </style>
</head>
<body>

  <div class="remito-container">
    
    <!-- ENCABEZADO CON LOGO Y MARCA EN NEGRO -->
    <header class="header">
      <div class="brand-section">
        <!-- Reemplazá 'logo.png' por la ruta/nombre de tu archivo de imagen en la carpeta del proyecto -->
        <img src="logo.png" alt="Logo Albardón" class="logo">
        <span class="marca-nombre">Albardón</span>
      </div>
      <div class="remito-tipo">
        <span class="letra-r">R</span>
        <p>REMITO</p>
      </div>
    </header>

    <!-- DATOS DE ENTREGA Y FECHA EDITABLE -->
    <section class="info-section">
      <div class="col-left">
        <div class="campo-group">
          <label for="cliente">Cliente / Estilo / Lugar:</label>
          <input type="text" id="cliente" placeholder="Nombre del cliente o bar">
        </div>
        <div class="campo-group">
          <label for="direccion">Dirección de Entrega:</label>
          <input type="text" id="direccion" placeholder="Calle y número">
        </div>
      </div>

      <div class="col-right">
        <!-- Campo para seleccionar manualmente la fecha de entrega real -->
        <div class="campo-group">
          <label for="fecha">Fecha de Entrega:</label>
          <input type="date" id="fecha" name="fecha">
        </div>
        <div class="campo-group">
          <label for="numero-remito">N° de Remito:</label>
          <input type="text" id="numero-remito" value="0001-00000001">
        </div>
      </div>
    </section>

    <!-- DETALLE DE BARRILES O PRODUCTOS -->
    <table class="tabla-items">
      <thead>
        <tr>
          <th class="text-center" style="width: 10%;">Cant.</th>
          <th style="width: 60%;">Descripción / Estilo de Cerveza</th>
          <th class="text-center" style="width: 30%;">Capacidad / Nº Barril</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="number" style="width: 100%; text-align: center;" value="1"></td>
          <td><input type="text" style="width: 100%;" placeholder="Ej: Honey / IPA / Stout"></td>
          <td><input type="text" style="width: 100%; text-align: center;" placeholder="Ej: Barril 50L #12"></td>
        </tr>
        <tr>
          <td><input type="number" style="width: 100%; text-align: center;"></td>
          <td><input type="text" style="width: 100%;"></td>
          <td><input type="text" style="width: 100%; text-align: center;"></td>
        </tr>
        <tr>
          <td><input type="number" style="width: 100%; text-align: center;"></td>
          <td><input type="text" style="width: 100%;"></td>
          <td><input type="text" style="width: 100%; text-align: center;"></td>
        </tr>
      </tbody>
    </table>

    <!-- OBSERVACIONES Y FIRMA -->
    <footer class="footer-section">
      <div class="observaciones">
        <div class="campo-group">
          <label for="obs">Observaciones / Estado del barril:</label>
          <textarea id="obs" placeholder="Aclaraciones sobre la entrega, devolución de conector, etc."></textarea>
        </div>
      </div>
      <div class="firma-box">
        Firma y Aclaración de Conformidad
      </div>
    </footer>

  </div>

  <script>
    // Asigna automáticamente la fecha del día de hoy por defecto, 
    // pero permite cambiarla en todo momento antes de imprimir o guardar.
    document.addEventListener('DOMContentLoaded', () => {
      const fechaInput = document.getElementById('fecha');
      const hoy = new Date().toISOString().split('T')[0];
      fechaInput.value = hoy;
    });
  </script>

</body>
</html>
